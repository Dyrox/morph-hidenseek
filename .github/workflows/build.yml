name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # Compiles client + server, runs the unit tests and packages the mod JAR.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: morph-hide-and-seek
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
